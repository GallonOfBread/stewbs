<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiP Timer</title>
<meta name="description" content="A countdown timer that floats over your other windows using Picture-in-Picture.">
<meta property="og:title" content="PiP Timer">
<meta property="og:description" content="A countdown timer that floats over your other windows using Picture-in-Picture.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/site.css">
<script src="/theme.js"></script>
<style>
  .card {
    max-width: 400px; margin: 0 auto; padding: 28px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; text-align: center;
  }
  .card h1 { margin-bottom: 20px; }
  .time-inputs { display: flex; gap: 8px; justify-content: center; align-items: center; font-size: 32px; color: var(--muted); }
  .time-inputs input {
    width: 90px; font: 600 32px var(--font); text-align: center; padding: 6px;
    background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
  }
  .presets { margin: 14px 0; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .card button { font-family: var(--font); cursor: pointer; }
  .presets button {
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 8px; font-size: 0.9rem; font-weight: 600;
  }
  .presets button:hover { border-color: var(--muted); }
  label.file { display: block; margin: 16px 0; font-size: 0.85rem; color: var(--muted); }
  label.file input { margin-top: 6px; max-width: 100%; color: var(--muted); font-family: var(--font); }
  .actions { display: flex; gap: 8px; justify-content: center; }
  .actions button { font-size: 1rem; font-weight: 700; padding: 10px 22px; border-radius: 10px; }
  #start { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
  #stop { background: var(--bg); color: var(--text); border: 1px solid var(--line); }
  #display { font-size: 56px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 18px 0 6px; }
  #status { font-size: 0.85rem; color: var(--muted); min-height: 1em; }
  video, canvas { display: none; }
</style>
</head>
<body>
<main class="page">
  <nav class="topbar">
    <a class="home" href="/"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>stewbs</a>
    <div class="topbar-actions">
      <button type="button" class="switch" data-theme-toggle role="switch" aria-label="Dark mode" title="Dark mode"></button>
    </div>
  </nav>

  <div class="card">
    <p class="kicker">Picture-in-Picture</p>
    <h1>Timer</h1>

    <div class="time-inputs">
      <input id="min" type="number" min="0" value="3"> :
      <input id="sec" type="number" min="0" max="59" value="00">
    </div>

    <div class="presets">
      <button data-m="1">1m</button>
      <button data-m="3">3m</button>
      <button data-m="5">5m</button>
      <button data-m="10">10m</button>
      <button data-m="25">25m</button>
    </div>

    <label class="file">
      Video to play when time's up (optional):<br>
      <input id="file" type="file" accept="video/*">
    </label>

    <div class="actions">
      <button id="start">Start</button>
      <button id="stop">Stop</button>
    </div>

    <div id="display">3:00</div>
    <div id="status"></div>
  </div>
</main>

<canvas id="canvas" width="480" height="270"></canvas>
<video id="pip" playsinline muted></video>

<script>
const $ = id => document.getElementById(id);
const canvas = $('canvas'), ctx = canvas.getContext('2d');
const pip = $('pip');
const useDocPip = 'documentPictureInPicture' in window;
let totalMs = 0, endTime = 0, ticker = null, videoURL = null, finished = false, flash = false;
let pipWin = null, ui = null, pausedLeft = null;   // Document PiP window + its elements (Chrome/Edge)

document.querySelectorAll('.presets button').forEach(b =>
  b.onclick = () => { $('min').value = b.dataset.m; $('sec').value = '00'; updateDisplay(b.dataset.m * 60000); });

$('file').onchange = e => {
  if (videoURL) URL.revokeObjectURL(videoURL);
  const f = e.target.files[0];
  videoURL = f ? URL.createObjectURL(f) : null;
};

const fmt = ms => {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};
const updateDisplay = ms => $('display').textContent = fmt(ms);
const inputMs = () => ((+$('min').value || 0) * 60 + (+$('sec').value || 0)) * 1000;

function draw(text, bg = '#000', fg = '#fff', size = 120) {
  ctx.fillStyle = bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = fg; ctx.font = `bold ${size}px -apple-system, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);
}

function beep() {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  [0, 0.35, 0.7].forEach(t => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0.3, ac.currentTime + t);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t + 0.3);
    o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.3);
  });
}

// ---- Chrome/Edge: Document PiP window with Apple Clock-style buttons ----
// Left button: Cancel (running/paused) or Stop (time's up).
// Right button: Start → Pause → Resume, or Repeat (time's up).
const BTN = {
  cancel: ['Cancel', 'grey'],   stop:   ['Stop', 'grey'],
  start:  ['Start', 'green'],   pause:  ['Pause', 'orange'],
  resume: ['Resume', 'green'],  repeat: ['Repeat', 'green'],
};
let pipState = 'running';   // running | paused | idle | done

async function openDocPip() {
  pipWin = await documentPictureInPicture.requestWindow({ width: 340, height: 240 });
  const d = pipWin.document;
  d.head.innerHTML = `<style>
    body { margin:0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
           background:#000; color:#fff; font-family:-apple-system,sans-serif; transition:background .15s; }
    #t { font-size:min(30vw, 50vh); line-height:1; font-weight:200; font-variant-numeric:tabular-nums; }
    #t.done { font-size:min(15vw, 28vh); font-weight:bold; }
    video { display:none; width:100%; flex:1; min-height:0; background:#000; }
    .row { display:flex; justify-content:space-between; width:100%; box-sizing:border-box; padding:min(3vw, 4vh) min(5vw, 6vh); }
    button { --s:clamp(56px, min(22vw, 32vh), 180px); width:var(--s); height:var(--s); border-radius:50%;
             font-size:calc(var(--s) * 0.2); border:none; cursor:pointer; box-shadow:0 0 0 3px #000, 0 0 0 5px var(--bg); }
    .grey   { --bg:#333336; background:var(--bg); color:#fff; }
    .green  { --bg:#0a2a12; background:var(--bg); color:#30d158; }
    .orange { --bg:#2f1d04; background:var(--bg); color:#ff9f0a; }
    button:disabled { opacity:.45; cursor:default; }
  </style>`;
  d.body.innerHTML = `<div id="t"></div><video playsinline></video>
    <div class="row"><button id="l"></button><button id="r"></button></div>`;
  ui = { body: d.body, t: d.getElementById('t'), v: d.querySelector('video'),
         l: d.getElementById('l'), r: d.getElementById('r') };
  ui.l.onclick = () => { if (pipState !== 'idle') cancel(); };
  ui.r.onclick = () => ({ running: pause, paused: resume, idle: restart, done: restart })[pipState]();
  pipWin.addEventListener('pagehide', () => { pipWin = ui = null; stop(); });
}

function setPipState(state) {
  pipState = state;
  if (!ui) return;
  const left = state === 'done' ? 'stop' : 'cancel';
  const right = { running: 'pause', paused: 'resume', idle: 'start', done: 'repeat' }[state];
  [[ui.l, left], [ui.r, right]].forEach(([b, k]) => { b.textContent = BTN[k][0]; b.className = BTN[k][1]; });
  ui.l.disabled = state === 'idle';   // like Apple: Cancel is dimmed when no timer is running
}

function resetPipView() {
  if (!ui) return;
  ui.v.pause(); ui.v.removeAttribute('src'); ui.v.load();
  ui.v.style.display = 'none'; ui.t.style.display = '';
  ui.t.classList.remove('done'); ui.body.style.background = '#000';
}

// ---- Safari fallback: video PiP, restart via the skip button ----
async function openVideoPip() {
  pip.removeAttribute('src');
  pip.srcObject = canvas.captureStream(10);
  pip.muted = true;
  await pip.play();
  await pip.requestPictureInPicture();
  try { navigator.mediaSession.setActionHandler('nexttrack', restart); } catch {}
}

async function start() {
  if (!useDocPip && !document.pictureInPictureEnabled) {
    $('status').textContent = 'Picture-in-Picture isn\'t supported in this browser (try Chrome, Edge, or Safari).';
    return;
  }
  totalMs = inputMs();
  if (totalMs <= 0) return;
  stop();
  try {
    // Browsers only allow PiP from a click, so it opens now and shows the countdown.
    if (useDocPip) { if (!pipWin) await openDocPip(); }
    else await openVideoPip();
  } catch (err) {
    $('status').textContent = 'Couldn\'t open PiP: ' + err.message;
  }
  beginCountdown();
}

function beginCountdown() {
  clearInterval(ticker);
  finished = false; pausedLeft = null;
  endTime = Date.now() + totalMs;
  setPipState('running');
  document.title = 'PiP Timer';
  $('status').textContent = 'Running — the PiP window will play when time is up.';
  ticker = setInterval(tick, 200);
  tick();
}

function pause() {
  pausedLeft = endTime - Date.now();
  clearInterval(ticker); ticker = null;
  setPipState('paused');
  $('status').textContent = 'Paused';
}

function resume() {
  endTime = Date.now() + pausedLeft;
  pausedLeft = null;
  setPipState('running');
  $('status').textContent = 'Running — the PiP window will play when time is up.';
  ticker = setInterval(tick, 200);
  tick();
}

// Cancel / Stop: end the timer (and any alert), keep the window open showing
// the original time so Start can run it again — same as Apple's Clock.
function cancel() {
  clearInterval(ticker); ticker = null;
  finished = false; pausedLeft = null;
  resetPipView();
  ui.t.textContent = fmt(totalMs);
  updateDisplay(totalMs);
  setPipState('idle');
  document.title = 'PiP Timer';
  $('status').textContent = '';
}

// Start (after cancel) / Repeat: run again with the same duration in the open window.
function restart() {
  if (!pipWin && !document.pictureInPictureElement) return start();
  if (ui) resetPipView();
  else {
    pip.pause(); pip.removeAttribute('src');
    pip.srcObject = canvas.captureStream(10);
    pip.muted = true; pip.play().catch(() => {});
  }
  beginCountdown();
}

function tick() {
  const left = endTime - Date.now();
  updateDisplay(left);
  if (left > 0) {
    if (ui) ui.t.textContent = fmt(left); else draw(fmt(left));
    return;
  }
  if (!finished) { finished = true; timesUp(); }
  if (!videoURL) {
    flash = !flash;
    if (ui) { ui.t.textContent = "TIME'S UP"; ui.t.classList.add('done'); ui.body.style.background = flash ? '#ff3b30' : '#000'; }
    else draw("TIME'S UP", flash ? '#ff3b30' : '#000', '#fff', 64);
  }
}

async function playVideo(v) {
  v.srcObject = null; v.src = videoURL; v.muted = false; v.loop = false;
  try { await v.play(); }
  catch { v.muted = true; await v.play(); }  // autoplay with sound blocked
}

async function timesUp() {
  document.title = "⏰ Time's up!";
  $('status').textContent = "Time's up!";
  setPipState('done');
  if (!videoURL) return beep();
  clearInterval(ticker); ticker = null;
  if (ui) {
    ui.t.style.display = 'none'; ui.v.style.display = 'block';
    await playVideo(ui.v);
  } else {
    await playVideo(pip);
    if (!document.pictureInPictureElement) pip.requestPictureInPicture().catch(() => {});
  }
}

function stop() {
  clearInterval(ticker); ticker = null;
  pip.pause();
  ui?.v.pause();
  if (document.pictureInPictureElement) document.exitPictureInPicture().catch(() => {});
  document.title = 'PiP Timer';
  $('status').textContent = '';
}

$('start').onclick = start;
$('stop').onclick = () => { stop(); pipWin?.close(); updateDisplay(inputMs()); };
</script>
</body>
</html>
