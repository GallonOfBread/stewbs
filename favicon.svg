<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Red accordion</title>
  <!-- Bellows (pleated) -->
  <g>
    <rect x="18" y="14" width="28" height="36" fill="#c62d28"/>
    <rect x="21" y="14" width="3" height="36" fill="#8c1d19"/>
    <rect x="27" y="14" width="3" height="36" fill="#8c1d19"/>
    <rect x="33" y="14" width="3" height="36" fill="#8c1d19"/>
    <rect x="39" y="14" width="3" height="36" fill="#8c1d19"/>
    <rect x="24" y="14" width="3" height="36" fill="#e4605a"/>
    <rect x="30" y="14" width="3" height="36" fill="#e4605a"/>
    <rect x="36" y="14" width="3" height="36" fill="#e4605a"/>
  </g>
  <!-- Left end: treble keyboard -->
  <rect x="3" y="7" width="17" height="50" rx="5" fill="#c62d28"/>
  <rect x="6" y="11" width="11" height="42" rx="3" fill="#1b1b1f"/>
  <g fill="#ffffff">
    <circle cx="10" cy="17" r="2.3"/>
    <circle cx="14" cy="23" r="2.3"/>
    <circle cx="10" cy="29" r="2.3"/>
    <circle cx="14" cy="35" r="2.3"/>
    <circle cx="10" cy="41" r="2.3"/>
    <circle cx="14" cy="47" r="2.3"/>
  </g>
  <!-- Right end: bass side -->
  <rect x="44" y="7" width="17" height="50" rx="5" fill="#c62d28"/>
  <rect x="47" y="11" width="11" height="42" rx="3" fill="#1b1b1f"/>
  <g fill="#c9ccd1">
    <circle cx="50.500" cy="17" r="2"/>
    <circle cx="54.500" cy="17" r="2"/>
    <circle cx="50.500" cy="24" r="2"/>
    <circle cx="54.500" cy="24" r="2"/>
    <circle cx="50.500" cy="31" r="2"/>
    <circle cx="54.500" cy="31" r="2"/>
    <circle cx="50.500" cy="38" r="2"/>
    <circle cx="54.500" cy="38" r="2"/>
    <circle cx="50.500" cy="45" r="2"/>
    <circle cx="54.500" cy="45" r="2"/>
  </g>
  <!-- Chrome trim where bellows meet the ends -->
  <rect x="19" y="12" width="2" height="40" rx="1" fill="#e6e8ec"/>
  <rect x="43" y="12" width="2" height="40" rx="1" fill="#e6e8ec"/>
</svg>
