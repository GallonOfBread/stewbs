<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stewbs</title>
<style>
  :root { --bg: #fafaf7; --fg: #1a1a1a; --muted: #666; --link: #0a5bd3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --fg: #eee; --muted: #999; --link: #6ea8ff; }
  }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg); padding: 0 16px;
  }
  main { max-width: 480px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin: 8px 0; }
  a { color: var(--link); text-decoration: none; font-size: 18px; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>I'm Josh Stubler.</h1>
  <p>This is a site for me to keep simple pages.</p>
  <ul>
    <li><a href="/uno/">Spicy Uno</a></li>
    <li><a href="/poker/">Poker variants</a></li>
    <li><a href="/timer/">Timer</a></li>
  </ul>
</main>
</body>
</html>
